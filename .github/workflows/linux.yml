name: linux
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libssl-dev libayatana-appindicator3-dev librsvg2-dev
          at-spi2-core
      - run: npm ci
      - run: npm run typecheck
      - name: Rust tests
        run: cargo test
        working-directory: apps/desktop/src-tauri
      - name: Desktop bundles (deb, rpm, appimage)
        run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  nix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: flake check
        run: nix flake check
      - name: dev shell smoke test
        run: nix develop --command bash -c "pkg-config --modversion webkit2gtk-4.1 && which cargo node"
